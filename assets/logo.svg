  <circle cx="63" cy="53" r="4.5" fill="#FFFFFF" />
  <circle cx="38" cy="52.5" r="2.2" fill="#4F46E5" />
  <circle cx="64" cy="52.5" r="2.2" fill="#4F46E5" />
  
